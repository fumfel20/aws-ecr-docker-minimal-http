name: Deploy Container to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AWS_REGION: eu-west-1
  ECR_REPOSITORY: aws-ecr-docker-minimal-http # replace with your ECR repository name

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            REGISTRY="${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com"
            IMAGE_URI="$REGISTRY/${{ env.ECR_REPOSITORY }}:latest"

            echo "Logging in to ECR on EC2 using IAM Role..."
            aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin $REGISTRY

            echo "Pulling new image from ECR..."
            docker pull $IMAGE_URI

            echo "Stopping old container..."
            docker stop my-app || true
            docker rm my-app || true

            echo "Running new container on port 80..."
            docker run -d \
              --name my-app \
              --restart always \
              -p 80:80 \
              $IMAGE_URI

            echo "Pruning unused images..."
            docker image prune -f
