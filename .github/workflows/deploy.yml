name: Deploy Container to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AWS_REGION: eu-west-1
  ECR_REPOSITORY: aws-ecr-docker-minimal-http # replace with your ECR repository name

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            REGISTRY="${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com"
            IMAGE_URI="$REGISTRY/${{ env.ECR_REPOSITORY }}:latest"

            echo "Pulling latest code on EC2..."
            if [ -d "$HOME/app" ]; then
              cd "$HOME/app" && git pull
            else
              git clone https://github.com/fumfel20/aws-ecr-docker-minimal-http.git "$HOME/app"
              cd "$HOME/app"
            fi

            echo "Building updated Docker image on EC2..."
            docker build -t $IMAGE_URI .

            echo "Logging in to ECR on EC2..."
            aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin $REGISTRY

            echo "Pushing new image to ECR..."
            docker push $IMAGE_URI

            echo "Restarting container..."
            docker stop my-app || true
            docker rm my-app || true

            echo "Running new container on port 80..."
            docker run -d \
              --name my-app \
              --restart always \
              -p 80:80 \
              $IMAGE_URI

            echo "Pruning unused images..."
            docker image prune -f
